# Render.com blueprint — deploy the Nabta API + managed Postgres in one click.
# In the Render dashboard: New → Blueprint → pick this repo. It reads this file.
services:
  - type: web
    name: nabta-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && python manage.py seed && gunicorn config.wsgi --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nabta-db
          property: connectionString
      # Any *.vercel.app origin is trusted by default (see config/settings.py),
      # so no extra vars are needed. To restrict to one domain later, add:
      #   DJANGO_CORS_ALLOWED_ORIGIN_REGEXES = ^https://your-app\.vercel\.app$

databases:
  - name: nabta-db
    plan: free
