# Render.com blueprint — deploy the Nabta API + managed Postgres in one click.
# In the Render dashboard: New → Blueprint → pick this repo. It reads this file.
services:
  - type: web
    name: nabta-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && python manage.py seed && gunicorn config.wsgi --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nabta-db
          property: connectionString
      # Set these two AFTER the Vercel frontend exists, then redeploy:
      #   DJANGO_CORS_ALLOWED_ORIGINS = https://your-app.vercel.app
      #   DJANGO_CSRF_TRUSTED_ORIGINS = https://your-app.vercel.app
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: nabta-db
    plan: free
